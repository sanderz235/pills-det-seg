<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>药丸检测与分割 - YOLO11 + SAM2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            min-height: 100vh;
        }

        .header {
            background: #16213e;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #0f3460;
        }

        .header h1 {
            font-size: 1.8em;
            color: #e94560;
            margin-bottom: 5px;
        }

        .header p {
            color: #a0a0b0;
            font-size: 0.9em;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 上传区域 */
        .upload-zone {
            border: 3px dashed #0f3460;
            border-radius: 16px;
            padding: 50px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #16213e;
            margin-bottom: 30px;
        }

        .upload-zone:hover,
        .upload-zone.drag-over {
            border-color: #e94560;
            background: #1a1a3e;
        }

        .upload-zone .icon {
            font-size: 3em;
            margin-bottom: 15px;
        }

        .upload-zone .text {
            font-size: 1.1em;
            color: #a0a0b0;
        }

        .upload-zone .hint {
            font-size: 0.85em;
            color: #666;
            margin-top: 10px;
        }

        .upload-zone input[type="file"] {
            display: none;
        }

        /* 加载动画 */
        .loading {
            display: none;
            text-align: center;
            padding: 30px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #0f3460;
            border-top: 4px solid #e94560;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 结果区域 */
        .results {
            display: none;
            gap: 20px;
            grid-template-columns: 1fr 1fr;
        }

        .results.active {
            display: grid;
        }

        .result-card {
            background: #16213e;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #0f3460;
        }

        .result-card .card-header {
            padding: 12px 20px;
            font-weight: bold;
            font-size: 1em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .result-card.detection .card-header {
            background: rgba(255, 140, 0, 0.2);
            color: #ff8c00;
            border-bottom: 2px solid #ff8c00;
        }

        .result-card.segmentation .card-header {
            background: rgba(233, 69, 96, 0.2);
            color: #e94560;
            border-bottom: 2px solid #e94560;
        }

        .result-card img {
            width: 100%;
            display: block;
        }

        .info-bar {
            padding: 10px 20px;
            font-size: 0.9em;
            color: #a0a0b0;
            background: rgba(0, 0, 0, 0.2);
        }

        /* 按钮 */
        .btn {
            display: inline-block;
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 15px;
        }

        .btn-primary {
            background: #e94560;
            color: white;
        }

        .btn-primary:hover {
            background: #c73a52;
        }

        .btn-secondary {
            background: #0f3460;
            color: #e0e0e0;
        }

        .btn-secondary:hover {
            background: #1a4a7a;
        }

        /* 响应式 */
        @media (max-width: 900px) {
            .results {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>药丸检测与分割</h1>
        <p>YOLO11 检测 + SAM2 分割 | Intel XPU</p>
    </div>

    <div class="container">
        <!-- 上传区域 -->
        <div class="upload-zone" id="uploadZone">
            <div class="icon">&#128138;</div>
            <div class="text">拖拽图片到此处，或点击选择图片</div>
            <div class="hint">支持 JPG、PNG、BMP 格式</div>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <!-- 加载动画 -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>正在推理中，请稍候...</p>
        </div>

        <!-- 结果展示 -->
        <div class="results" id="results">
            <div class="result-card detection">
                <div class="card-header">
                    <span>&#128309;</span> Detection | YOLO11
                </div>
                <img id="detectionImg" src="" alt="检测结果">
                <div class="info-bar" id="detectionInfo"></div>
            </div>
            <div class="result-card segmentation">
                <div class="card-header">
                    <span>&#128308;</span> Segmentation | SAM2
                </div>
                <img id="segmentationImg" src="" alt="分割结果">
                <div class="info-bar" id="segmentationInfo"></div>
            </div>
        </div>
    </div>

    <script>
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');
        const detectionImg = document.getElementById('detectionImg');
        const segmentationImg = document.getElementById('segmentationImg');
        const detectionInfo = document.getElementById('detectionInfo');
        const segmentationInfo = document.getElementById('segmentationInfo');

        // 点击上传区域
        uploadZone.addEventListener('click', () => fileInput.click());

        // 拖拽事件
        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('drag-over');
        });

        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('drag-over');
        });

        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('drag-over');
            const file = e.dataTransfer.files[0];
            if (file) handleFile(file);
        });

        // 文件选择
        fileInput.addEventListener('change', () => {
            const file = fileInput.files[0];
            if (file) handleFile(file);
        });

        async function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                alert('请选择图片文件');
                return;
            }

            // 显示加载状态
            loading.classList.add('active');
            results.classList.remove('active');

            // 上传并推理
            const formData = new FormData();
            formData.append('image', file);

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: formData,
                });

                const data = await response.json();

                if (data.error) {
                    alert('推理失败: ' + data.error);
                } else {
                    // 显示结果
                    detectionImg.src = data.detection_image;
                    segmentationImg.src = data.segmentation_image;
                    detectionInfo.textContent = `检测到 ${data.detections} 个药丸 | ${data.original_filename}`;
                    segmentationInfo.textContent = `SAM2 分割完成 | ${data.detections} 个区域`;
                    results.classList.add('active');
                }
            } catch (err) {
                alert('请求失败: ' + err.message);
            } finally {
                loading.classList.remove('active');
            }
        }
    </script>
</body>
</html>
